services:
  # Backend FastAPI service
  - type: web
    name: campusiq-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: campusiq-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # Frontend Static Site
  - type: web
    name: campusiq-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && VITE_API_URL=https://campusiq-backend.onrender.com npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 18
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: campusiq-db
    databaseName: campusiq
    user: campusiq
